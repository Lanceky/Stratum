<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The chain, as three linked blocks — the same figure the audit trail
       draws. Indigo is reserved throughout for anything a human is
       accountable for, so the signed block is the bright one. -->
  <rect width="32" height="32" rx="7" fill="#0b0d12"/>
  <rect x="7" y="6"  width="18" height="5.5" rx="1.6" fill="none" stroke="#6366f1" stroke-opacity="0.45"/>
  <rect x="7" y="13.25" width="18" height="5.5" rx="1.6" fill="none" stroke="#6366f1" stroke-opacity="0.7"/>
  <rect x="7" y="20.5" width="18" height="5.5" rx="1.6" fill="#6366f1"/>
  <path d="M16 11.5v1.75M16 18.75v1.75" stroke="#818cf8" stroke-width="1.4"/>
</svg>
